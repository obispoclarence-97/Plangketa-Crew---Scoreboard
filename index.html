<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plangketa Crew - Scoreboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="table-bg">
  <header class="header">
    <h1>PLANGKETA CREW</h1>
    <p>Friendly Billiards Tournament Dashboard</p>
  </header>

  <section class="scoreboard">
    <div class="player-card">
      <select id="player1">
        <option>Clarence</option>
        <option>Zeke</option>
        <option>Kyzer</option>
        <option>Josh</option>
      </select>
      <div id="score1" class="score">0</div>
      <div class="controls">
        <button onclick="changeScore(1,1)">+1</button>
        <button onclick="changeScore(1,-1)">-1</button>
      </div>
    </div>

    <div class="vs">VS</div>

    <div class="player-card">
      <select id="player2">
        <option>Zeke</option>
        <option>Clarence</option>
        <option>Kyzer</option>
        <option>Josh</option>
      </select>
      <div id="score2" class="score">0</div>
      <div class="controls">
        <button onclick="changeScore(2,1)">+1</button>
        <button onclick="changeScore(2,-1)">-1</button>
      </div>
    </div>
  </section>

  <div class="actions">
    <button class="submit" onclick="submitMatch()">Submit Match</button>
    <button class="reset" onclick="resetScores()">Reset</button>
  </div>

  <section class="panels">
    <div class="panel">
      <h2>🏆 Rankings</h2>
      <table>
        <thead><tr><th>Place</th><th>Player</th><th>Wins</th><th>Losses</th></tr></thead>
        <tbody id="rankings"></tbody>
      </table>
    </div>

    <div class="panel">
      <h2>Recent Matches</h2>
      <ul id="history"></ul>
    </div>
  </section>
</div>

<script src="app.js"></script>
</body>
</html>
